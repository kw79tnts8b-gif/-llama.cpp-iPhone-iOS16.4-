name: Build llama.cpp v0.9.0

on:
  workflow_dispatch:

env:
  LLAMA_TAG: v0.9.0
  DEPLOYMENT_TARGET: "16.4"
  BUILD_TYPE: Release

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Check Xcode / SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          ninja --version

      - name: Checkout llama.cpp ${{ env.LLAMA_TAG }}
        run: |
          git clone --recursive https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git checkout ${{ env.LLAMA_TAG }}
          git submodule update --init --recursive

      - name: Build Web UI (best-effort)
        working-directory: llama.cpp/tools/server
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build
          else
            echo "No package.json, skip UI build"
          fi

      - name: CMake configure
        working-directory: llama.cpp
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_STATIC=ON \
            \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            \
            -DLLAMA_BUILD_UI=ON \
            -DLLAMA_BUILD_WEBUI=ON \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF

      - name: Verify CMake options
        working-directory: llama.cpp
        run: |
          cmake -LA build-ios | grep -Ei 'METAL|UI|SERVER|TOOLS|OPENSSL|CURL' | sort || true

      - name: Build
        working-directory: llama.cpp
        run: |
          cmake --build build-ios --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Collect binaries
        working-directory: llama.cpp
        run: |
          mkdir -p artifacts
          find build-ios -type f -name 'llama-cli' -exec cp {} artifacts/ \;
          find build-ios -type f -name 'llama-server' -exec cp {} artifacts/ \;

          ls -lh artifacts/
          file artifacts/llama-cli
          file artifacts/llama-server
          otool -l artifacts/llama-server | grep -A2 LC_BUILD_VERSION || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-arm64-v0.9.0
          path: llama.cpp/artifacts/*
          retention-days: 30
