name: build-llama-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      LLAMA_ZIP_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip
      SDK_ZIP_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip
      MIN_IOS: "16.4"

    steps:
      - name: Install cmake and ninja
        run: brew install cmake ninja

      - name: Fetch iPhoneOS 17.5 SDK
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          curl -fL --retry 3 --retry-delay 2 -o sdk.zip "$SDK_ZIP_URL"
          ditto -x -k sdk.zip "$GITHUB_WORKSPACE/sdk"
          rm -rf "$GITHUB_WORKSPACE/sdk/__MACOSX"
          SDK=$(find "$GITHUB_WORKSPACE/sdk" -type d -name '*.sdk' -not -path '*/__MACOSX/*' | head -n1)
          test -n "$SDK"
          test -f "$SDK/usr/lib/libSystem.tbd"
          echo "SDK_DIR=$SDK" >> "$GITHUB_ENV"
          echo "SDK -> $SDK"

      - name: Fetch llama.cpp v1.0.0
        run: |
          set -eu
          curl -fL --retry 3 --retry-delay 2 -o llama.zip "$LLAMA_ZIP_URL"
          unzip -q llama.zip -d "$GITHUB_WORKSPACE/src"
          SRC=$(find "$GITHUB_WORKSPACE/src" -maxdepth 1 -mindepth 1 -type d | head -n1)
          mv "$SRC" "$GITHUB_WORKSPACE/llama.cpp"
          test -f "$GITHUB_WORKSPACE/llama.cpp/CMakeLists.txt"

      - name: Inspect upstream lib types
        run: |
          grep -RInE "add_library\((llama-server-impl|llama-cli-impl)" "$GITHUB_WORKSPACE/llama.cpp/tools" || true

      - name: Configure (CMake + Ninja, iOS arm64, static libs)
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE/llama.cpp" -B "$GITHUB_WORKSPACE/build-ios" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION="$MIN_IOS" \
            -DCMAKE_OSX_SYSROOT="$SDK_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_IOS" \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_AR="$(xcrun --find ar)" \
            -DCMAKE_RANLIB="$(xcrun --find ranlib)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DGGML_SHARED=OFF \
            -DGGML_STATIC=ON \
            -DLLAMA_BUILD_SHARED_LIBS=OFF \
            -DLLAMA_SHARED=OFF \
            -DLLAMA_STATIC=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_METAL=OFF \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build llama-cli and llama-server
        run: |
          set -eu
          cmake --build "$GITHUB_WORKSPACE/build-ios" \
            --target llama-cli llama-server \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect and self-contain
        run: |
          set -eu
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          for name in llama-cli llama-server; do
            BIN=$(find "$GITHUB_WORKSPACE/build-ios" -type f -name "$name" -not -path '*/CMakeFiles/*' | head -n1)
            test -n "$BIN"
            cp "$BIN" "$OUT/$name"
            chmod +x "$OUT/$name"
          done

          fix_refs() {
            f="$1"
            otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/Library/*) ;;
                *)
                  base=$(basename "$dep")
                  install_name_tool -change "$dep" "@executable_path/$base" "$f" 2>/dev/null || true
                  ;;
              esac
            done
          }

          BAD=0
          for name in llama-cli llama-server; do
            deps=$(otool -L "$OUT/$name" | tail -n +2 | awk '{print $1}')
            echo "=== $name deps ==="
            echo "$deps"
            if echo "$deps" | grep -vqE '^(/usr/lib/|/System/Library/)'; then
              BAD=1
            fi
          done

          if [ "$BAD" -eq 1 ]; then
            echo "::warning::still linked against non-system dylibs; bundling them next to binaries"
            cp "$GITHUB_WORKSPACE"/build-ios/bin/*.dylib "$OUT/" 2>/dev/null || true
            for f in "$OUT"/*; do
              [ -f "$f" ] || continue
              file "$f" | grep -q 'Mach-O' || continue
              if file "$f" | grep -q 'dynamically linked shared library'; then
                install_name_tool -id "@executable_path/$(basename "$f")" "$f" 2>/dev/null || true
              fi
              fix_refs "$f"
            done
          fi

          ls -l "$OUT"

      - name: Verify
        run: |
          set -eu
          for bin in out/llama-cli out/llama-server; do
            echo "=== $bin ==="
            file "$bin"
            lipo -archs "$bin"
            stat -f 'size=%z bytes' "$bin"
            if otool -l "$bin" | grep -q LC_CODE_SIGNATURE; then
              echo "::error::$bin contains LC_CODE_SIGNATURE"
              exit 1
            fi
            echo "no LC_CODE_SIGNATURE: OK"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-16.4-arm64-unsigned
          if-no-files-found: error
          path: out/
