name: build-ios-metallib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git fetch origin tag v0.9.0 --depth 1
          git checkout v0.9.0
          cd ..

      - name: Compile Metal shaders -> default.metallib (iOS 16)
        run: |
          cd llama.cpp

          # 确认主 metal 文件存在
          ls ggml/src/ggml-metal.metal

          xcrun metal -Os \
            -target air64-apple-ios16.0 \
            -fno-fast-math \
            ggml/src/ggml-metal.metal \
            -o ggml-metal.air

          xcrun metallib ggml-metal.air -o default.metallib

          rm -f ggml-metal.air
          ls -lh default.metallib

      - name: Upload default.metallib
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: llama.cpp/default.metallib
          retention-days: 7
