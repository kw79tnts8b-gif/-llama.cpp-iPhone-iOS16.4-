name: build-llama-ios-metal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout llama.cpp v1.0.0
        run: |
          curl -L https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.tar.gz | tar xz
          mv llama.cpp-1.0.0 llama.cpp

      - name: Setup iOS SDK
        run: |
          curl -L -o iPhoneOS17.5.sdk.zip "YOUR_SDK_URL_HERE"
          sudo mkdir -p /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs
          sudo unzip -q iPhoneOS17.5.sdk.zip -d /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/
          ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja ldid

      - name: Configure (Metal ON, Static, No Bundle)
        run: |
          mkdir build && cd build
          cmake ../llama.cpp \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS17.5.sdk \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_SHARED=OFF \
            -DGGML_STATIC=ON \
            -DLLAMA_BUILD_SHARED_LIBS=OFF \
            -DLLAMA_SHARED=OFF \
            -DLLAMA_STATIC=ON \
            -DGGML_METAL=ON \
            -DGGML_BLAS=ON \
            -DGGML_ACCELERATE=ON \
            -DBUILD_TESTING=OFF \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Inspect hardcoded SHARED
        run: |
          echo "=== Checking for hardcoded SHARED in tools ==="
          grep -R "add_library.*SHARED" build/CMakeFiles/ 2>/dev/null || echo "No SHARED forced"
          grep -R "add_library.*llama-cli-impl\|add_library.*llama-server-impl" build/CMakeFiles/ 2>/dev/null || echo "No impl SHARED"

      - name: Collect binaries
        run: |
          mkdir -p out
          cp build/bin/llama-cli out/ 2>/dev/null || cp build/llama-cli out/ 2>/dev/null
          cp build/bin/llama-server out/ 2>/dev/null || cp build/llama-server out/ 2>/dev/null
          ls -lh out/

      - name: Sign with ldid (放开0签名限制)
        run: |
          # 创建最小 entitlements（允许 Metal、JIT 等）
          cat > entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.device.metal</key>
            <true/>
          </dict>
          </plist>
          EOF
          ldid -S entitlements.plist out/llama-cli
          ldid -S entitlements.plist out/llama-server
          echo "=== Signature check ==="
          otool -l out/llama-cli | grep -A2 LC_CODE_SIGNATURE || echo "No signature section"

      - name: Verify
        run: |
          stat -f "llama-cli: %z bytes" out/llama-cli
          stat -f "llama-server: %z bytes" out/llama-server
          file out/llama-cli
          otool -L out/llama-cli | head -10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-metal
          path: out/
