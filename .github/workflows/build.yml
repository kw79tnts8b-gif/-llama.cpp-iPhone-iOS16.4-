name: Build llama.cpp iOS Metal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout llama.cpp v1.0.0
        run: |
          curl -L https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.tar.gz -o llama.cpp.tar.gz
          tar xzf llama.cpp.tar.gz
          mv llama.cpp-1.0.0 llama.cpp

      - name: Install dependencies
        run: |
          brew install cmake ninja ldid

      - name: Prepare iOS SDK
        run: |
          mkdir -p $HOME/ios-sdk
          curl -L ${{ secrets.IOS_SDK_URL }} -o sdk.zip
          unzip sdk.zip -d $HOME/ios-sdk/
          echo "SDK_ROOT=$HOME/ios-sdk/iPhoneOS17.5.sdk" >> $GITHUB_ENV

      - name: Create entitlements.xml
        run: |
          cat > entitlements.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.gpu</key>
              <true/>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Configure CMake
        working-directory: llama.cpp
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION=16.4 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=$SDK_ROOT \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-march=armv8.4-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8.4-a" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_SHARED=OFF \
            -DGGML_STATIC=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_SHARED_LIBS=OFF \
            -DLLAMA_SHARED=OFF \
            -DLLAMA_STATIC=ON \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/out

      - name: Build
        working-directory: llama.cpp
        run: |
          cmake --build build --target llama-cli llama-server -j$(sysctl -n hw.ncpu)

      - name: Inspect linkage
        working-directory: llama.cpp
        run: |
          echo "=== llama-cli otool ==="
          otool -L build/bin/llama-cli || true
          echo "=== llama-server otool ==="
          otool -L build/bin/llama-server || true
          echo "=== libggml-metal ==="
          ls -la build/src/libggml-metal* || true
          otool -L build/src/libggml-metal.dylib || true

      - name: Collect artifacts
        working-directory: llama.cpp
        run: |
          mkdir -p out
          cp build/bin/llama-cli out/
          cp build/bin/llama-server out/
          # Metal dylib
          cp build/src/libggml-metal.dylib out/ 2>/dev/null || true
          # 兜底：如果没嵌 metallib，单独拷
          cp build/src/default.metallib out/ 2>/dev/null || true
          chmod +x out/llama-cli out/llama-server

      - name: Sign with ldid
        working-directory: llama.cpp
        run: |
          # 签 Metal dylib（先签依赖）
          if [ -f out/libggml-metal.dylib ]; then
            ldid -Sentitlements.xml out/libggml-metal.dylib
            echo "Signed libggml-metal.dylib"
          fi
          # 签可执行文件
          ldid -Sentitlements.xml out/llama-cli
          ldid -Sentitlements.xml out/llama-server
          echo "Signed llama-cli and llama-server"

      - name: Verify signatures
        working-directory: llama.cpp
        run: |
          echo "=== Signature check ==="
          codesign -vvv out/llama-cli 2>&1 || true
          otool -l out/llama-cli | grep -A2 LC_CODE_SIGNATURE || echo "No LC_CODE_SIGNATURE (expected with ldid)"
          echo "=== File sizes ==="
          stat -f "%z bytes  %N" out/llama-cli out/llama-server
          if [ -f out/libggml-metal.dylib ]; then
            stat -f "%z bytes  %N" out/libggml-metal.dylib
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-ios-metal
          path: llama.cpp/out/*
