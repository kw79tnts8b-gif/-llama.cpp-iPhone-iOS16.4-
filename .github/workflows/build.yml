name: build-ios-metallib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git

      - name: Find and compile Metal shader
        run: |
          cd llama.cpp

          # 先看看 .metal 文件到底在哪
          find . -name "*.metal" -type f

          # 编 metallib
          xcrun metal -Os \
            -target air64-apple-ios16.0 \
            -fno-fast-math \
            ggml/src/ggml-metal.metal \
            -o ggml-metal.air

          xcrun metallib ggml-metal.air -o default.metallib

          rm -f ggml-metal.air

          ls -lh default.metallib

      - name: Upload default.metallib
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: llama.cpp/default.metallib
          retention-days: 7
