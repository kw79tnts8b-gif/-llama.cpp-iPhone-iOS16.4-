name: Build llama.cpp iOS (Metal)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      LLAMA_DIR: ${{ github.workspace }}/llama.cpp

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b1-c4d1ffc
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure (iOS arm64 + Metal, deployment target 16.4)
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          cmake -B build-ios-metal -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_C_COMPILER=$(xcrun --find clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun --find clang++) \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=OFF \
            -DGGML_METAL_TARGET_OS=ios \
            -DGGML_CPU_KLEIDIAI=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_CLI=ON

      - name: Build
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          cmake --build build-ios-metal -j$(sysctl -n hw.ncpu)

      - name: Ad-hoc codesign (macOS runner)
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          ENT=$(mktemp).plist
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>platform-application</key><true/>
          <key>com.apple.private.security.no-sandbox</key><true/>
          <key>com.apple.private.security.container-required</key><false/>
          <key>task_for_pid-allow</key><true/>
          <key>get-task-allow</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - --entitlements "$ENT" "$LLAMA_DIR/build-ios-metal/bin/llama-cli"
          codesign --force --sign - --entitlements "$ENT" "$LLAMA_DIR/build-ios-metal/bin/llama-server"
          rm "$ENT"

      - name: Collect artifacts
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          mkdir -p artifacts
          cp build-ios-metal/bin/llama-cli artifacts/llama-cli-metal
          cp build-ios-metal/bin/llama-server artifacts/llama-server-metal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal
          path: ${{ env.LLAMA_DIR }}/artifacts/*
