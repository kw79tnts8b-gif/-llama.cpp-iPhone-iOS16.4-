name: build-llama-ios-metal

on:
  workflow_dispatch:
  push:
    tags:
      - "llama-ios-*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git

      - name: Install CMake & Ninja
        run: |
          brew install cmake ninja

      - name: Download iPhoneOS17.5 SDK (community)
        run: |
          mkdir -p "$RUNNER_TEMP/ios-sdk"
          curl -L -o "$RUNNER_TEMP/iPhoneOS17.5.sdk.zip" \
            https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip
          unzip -q "$RUNNER_TEMP/iPhoneOS17.5.sdk.zip" -d "$RUNNER_TEMP/ios-sdk/"
          SDK_PATH=$(find "$RUNNER_TEMP/ios-sdk" -name "iPhoneOS17.5.sdk" -maxdepth 3 -type d | head -n1)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "Found SDK at: $SDK_PATH"

      - name: Configure CMake (iOS arm64, Metal, min iOS 16.4)
        run: |
          cd llama.cpp
          cmake -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=${{ env.SDK_PATH }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_CPU=ON \
            -DGGML_REPACK=ON \
            -DGGML_KLEIDIAI=ON \
            -DGGML_BLAS=OFF \
            -DGGML_ACCELERATE=OFF \
            -DLLAMA_BUILD_CLI=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd llama.cpp
          cmake --build build-ios --config Release -j$(sysctl -n hw.ncpu)

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          find llama.cpp/build-ios -type f -name "llama-cli" -exec cp {} artifacts/ \;
          find llama.cpp/build-ios -type f -name "llama-server" -exec cp {} artifacts/ \;
          find llama.cpp/build-ios -type f -name "ggml-metal.metallib" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Strip & sign (ad-hoc, 越狱环境用)
        run: |
          cd artifacts
          xcrun strip llama-cli 2>/dev/null || true
          xcrun strip llama-server 2>/dev/null || true
          which ldid >/dev/null 2>&1 && ldid -S llama-cli; ldid -S llama-server || echo "ldid not present, sign on device later"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal
          path: |
            artifacts/llama-cli
            artifacts/llama-server
            artifacts/ggml-metal.metallib
          if-no-files-found: warn
