name: Build llama-cli & llama-server for iOS (jailbreak, no-sign)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout dummy
        uses: actions/checkout@v4

      - name: Download llama.cpp v1.0.0
        run: |
          curl -L -o llama.cpp.zip https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip

      - name: Unzip llama.cpp
        run: |
          unzip -q llama.cpp.zip
          # 解压后目录：llama.cpp-1.0.0/

      - name: Download iPhoneOS17.5.sdk
        run: |
          curl -L -o iPhoneOS17.5.sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip

      - name: Unzip iPhoneOS17.5.sdk
        run: |
          unzip -q iPhoneOS17.5.sdk.zip
          # 解压后目录：iPhoneOS17.5.sdk/

      - name: Configure CMake (Xcode, iOS arm64, no Metal, no sign)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(pwd)/iPhoneOS17.5.sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DIPHONEOS_DEPLOYMENT_TARGET=16.4 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_CPU=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_IS_DEV=OFF \
            -S llama.cpp-1.0.0

      - name: Build llama-cli and llama-server only
        run: |
          cmake --build build --config Release --target llama-cli llama-server

      - name: Strip binaries (no codesign, no entitlements)
        run: |
          strip build/Release/llama-cli || true
          strip build/Release/llama-server || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-arm64-nosign
          path: |
            build/Release/llama-cli
            build/Release/llama-server
