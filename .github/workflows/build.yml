name: Build llama.cpp iOS arm64 (Metal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
      SDK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
      SDK_DIR: "iPhoneOS16.5.sdk"
      DEPLOYMENT_TARGET: "16.5"
      LLVM_VER: "17"

    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp

      - name: Download & extract iPhoneOS16.5 SDK
        run: |
          curl -L "$SDK_URL" -o sdk.tar.xz
          mkdir -p sdk
          tar xf sdk.tar.xz -C sdk
          mv sdk/iPhoneOS16.5.sdk "$SDK_DIR"

      - name: Install LLVM (clang)
        run: |
          brew install llvm@${LLVM_VER}
          echo "$(brew --prefix llvm@${LLVM_VER})/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          mkdir -p llama.cpp/build && cd llama.cpp/build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(pwd)/../../$SDK_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm@${LLVM_VER})/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@${LLVM_VER})/bin/clang++" \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_BLAS=OFF \
            -DGGML_ACCELERATE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Build
        run: |
          cd llama.cpp/build
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Strip binaries
        run: |
          cd llama.cpp/build/bin
          llvm-strip llama-cli llama-server

      - name: Codesign (ad-hoc)
        run: |
          cd llama.cpp/build/bin
          codesign --force --deep --sign - llama-cli
          codesign --force --deep --sign - llama-server

      - name: Collect artifacts
        run: |
          mkdir -p upload
          cp llama.cpp/build/bin/llama-cli upload/
          cp llama.cpp/build/bin/llama-server upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal
          path: upload/
