      - name: Compile Metal shaders -> default.metallib (iOS 16)
        run: |
          cd llama.cpp
          cd ggml/src/ggml-metal

          # 收集所有 metal 源（主文件 + kernels）
          METAL_FILES=$(find . -name '*.metal' -type f)

          echo "Metal sources:"
          echo "$METAL_FILES"

          xcrun metal -Os \
            -target air64-apple-ios16.0 \
            -fno-fast-math \
            $METAL_FILES \
            -o ggml-metal.air

          xcrun metallib ggml-metal.air -o default.metallib

          rm -f ggml-metal.air
          ls -lh default.metallib
