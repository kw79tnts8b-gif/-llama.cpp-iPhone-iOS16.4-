name: Build llama.cpp for iOS (jailbroken, arm64, Metal, iOS 16.4)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
env:
  SDK_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.9.2.zip
  DEPLOYMENT_TARGET: "16.4"
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ldid
        run: brew install ldid

      - name: Download & extract iPhoneOS SDK
        run: |
          curl -L "$SDK_URL" -o iPhoneOS18.5.sdk.zip
          unzip -q iPhoneOS18.5.sdk.zip
          if [ -d "iPhoneOS18.5.sdk" ]; then
            SDK_DIR="$(pwd)/iPhoneOS18.5.sdk"
          elif [ -d "iPhoneOS18.5.sdk/iPhoneOS18.5.sdk" ]; then
            SDK_DIR="$(pwd)/iPhoneOS18.5.sdk/iPhoneOS18.5.sdk"
          else
            SDK_DIR="$(find . -maxdepth 2 -name '*.sdk' -type d | head -1)"
          fi
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK path: $SDK_DIR"

      - name: Download & extract llama.cpp v0.9.2
        run: |
          curl -L "$LLAMA_URL" -o llama.cpp.zip
          unzip -q llama.cpp.zip
          mv llama.cpp-0.9.2 llama.cpp
          echo "LLAMA_DIR=$(pwd)/llama.cpp" >> $GITHUB_ENV

      - name: Configure CMake (Metal, force iOS 16.4, NBUFFERS=32)
        run: |
          cmake -B "$LLAMA_DIR/build-ios" \
            -S "$LLAMA_DIR" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ env.SDK_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
            -DCMAKE_C_FLAGS="-target arm64-apple-ios${{ env.DEPLOYMENT_TARGET }}" \
            -DCMAKE_CXX_FLAGS="-target arm64-apple-ios${{ env.DEPLOYMENT_TARGET }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLAMA_STATIC=ON \
            -DGGML_STATIC=ON \
            -DLLAMA_NATIVE=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NBUFFERS=32 \
            -DGGML_METAL_MAX_BUFFERS=64 \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios" --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Ad-hoc codesign
        run: |
          find "$LLAMA_DIR/build-ios" -name "llama-cli" -exec codesign --force --sign - {} \;
          find "$LLAMA_DIR/build-ios" -name "llama-server" -exec codesign --force --sign - {} \;

      - name: ldid sign with Metal entitlements
        run: |
          cat > metal-ent.xml <<'EOF'
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.iokit-user-client-class</key>
              <array>
                  <string>AGXDevice</string>
                  <string>AGXCommandQueue</string>
                  <string>AGXDeviceUserClient</string>
                  <string>AGXSharedUserClient</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>MTLDevice</string>
              </array>
          </dict>
          </plist>
          EOF
          ldid -Smetal-ent.xml "$LLAMA_DIR/build-ios/bin/llama-cli"
          ldid -Smetal-ent.xml "$LLAMA_DIR/build-ios/bin/llama-server"

      - name: Verify minos version
        run: |
          echo "=== llama-cli minos ==="
          otool -l "$LLAMA_DIR/build-ios/bin/llama-cli" | grep -A3 LC_BUILD_VERSION
          echo "=== llama-server minos ==="
          otool -l "$LLAMA_DIR/build-ios/bin/llama-server" | grep -A3 LC_BUILD_VERSION

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$LLAMA_DIR/build-ios/bin/llama-cli" dist/llama-cli-metal
          cp "$LLAMA_DIR/build-ios/bin/llama-server" dist/llama-server-metal
          chmod +x dist/llama-cli-metal dist/llama-server-metal
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal-ios16.4-v0.9.2
          path: dist/
