name: Build llama.cpp for iOS (jailbroken, arm64, Metal GPU)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  SDK_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.9.0.zip
  DEPLOYMENT_TARGET: "16.4"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout (minimal, no git history needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download & extract iPhoneOS SDK
        run: |
          curl -L "$SDK_URL" -o iPhoneOS17.5.sdk.zip
          unzip -q iPhoneOS17.5.sdk.zip
          if [ -d "iPhoneOS17.5.sdk" ]; then
            SDK_DIR="$(pwd)/iPhoneOS17.5.sdk"
          elif [ -d "iPhoneOS17.5.sdk/iPhoneOS17.5.sdk" ]; then
            SDK_DIR="$(pwd)/iPhoneOS17.5.sdk/iPhoneOS17.5.sdk"
          else
            SDK_DIR="$(find . -maxdepth 2 -name '*.sdk' -type d | head -1)"
          fi
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK path: $SDK_DIR"

      - name: Download & extract llama.cpp v0.9.0
        run: |
          curl -L "$LLAMA_URL" -o llama.cpp.zip
          unzip -q llama.cpp.zip
          mv llama.cpp-0.9.0 llama.cpp
          echo "LLAMA_DIR=$(pwd)/llama.cpp" >> $GITHUB_ENV

      - name: Configure CMake (Metal GPU enabled)
        run: |
          cmake -B "$LLAMA_DIR/build-ios" \
            -S "$LLAMA_DIR" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ env.SDK_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DIPHONEOS_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLAMA_STATIC=ON \
            -DGGML_STATIC=ON \
            -DLLAMA_NATIVE=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_ACCELERATE=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios" --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Ad-hoc codesign (binary + metallib)
        run: |
          find "$LLAMA_DIR/build-ios" -name "llama-cli" -exec codesign --force --sign - {} \;
          find "$LLAMA_DIR/build-ios" -name "llama-server" -exec codesign --force --sign - {} \;
          find "$LLAMA_DIR/build-ios" -name "default.metallib" -exec codesign --force --sign - {} \;

      - name: Collect artifacts (binaries + metallib together)
        run: |
          mkdir -p dist
          cp "$LLAMA_DIR/build-ios/bin/llama-cli" dist/ || true
          cp "$LLAMA_DIR/build-ios/bin/llama-server" dist/ || true
          cp "$LLAMA_DIR/ggml/src/ggml-metal.metal" dist/ 2>/dev/null || true
          # embedded metallib (built into binary) + standalone default.metallib
          find "$LLAMA_DIR/build-ios" -name "default.metallib" -exec cp {} dist/ \;
          if [ ! -f "dist/llama-cli" ]; then
            find "$LLAMA_DIR/build-ios" -name "llama-cli" -exec cp {} dist/ \;
          fi
          if [ ! -f "dist/llama-server" ]; then
            find "$LLAMA_DIR/build-ios" -name "llama-server" -exec cp {} dist/ \;
          fi
          chmod +x dist/llama-cli dist/llama-server
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal
          path: dist/
