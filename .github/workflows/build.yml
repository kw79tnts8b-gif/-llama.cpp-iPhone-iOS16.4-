name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "llama.cpp tag"
        required: false
        default: "v0.9.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.tag || 'v0.9.0' }}
          submodules: recursive

      - run: brew install cmake ninja ldid

      - name: Build
        run: |
          set -e
          export SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC=$(xcrun --sdk iphoneos -f clang)
          export CXX=$(xcrun --sdk iphoneos -f clang++)

          cmake -B b -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ON \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DCODE_SIGNING_ALLOWED=NO

          cmake --build b -j

          file b/bin/llama-cli b/bin/llama-server

      - name: Fakesign
        run: |
          set -e
          cat > ent.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.cs.allow-jit</key><true/>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          <key>com.apple.security.cs.disable-library-validation</key><true/>
          <key>platform-application</key><true/>
          </dict></plist>
          EOF

          ldid -Sent.xml b/bin/llama-cli
          ldid -Sent.xml b/bin/llama-server

          mkdir -p ios-bin
          cp b/bin/llama-cli ios-bin/
          cp b/bin/llama-server ios-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: llama-ios-${{ inputs.tag || 'v0.9.0' }}
          path: ios-bin
