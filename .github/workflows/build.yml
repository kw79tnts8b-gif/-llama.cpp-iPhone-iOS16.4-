name: ios-llama-static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout（仅拿 workflow 上下文，不拉 llama 源码）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install cmake + ninja
        uses: lukka/get-cmake@latest

      - name: Download SDK + llama.cpp v1.0.0
        run: |
          mkdir -p $HOME/ios-sdk $HOME/src
          curl -L -o $HOME/ios-sdk/sdk.zip "https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip"
          curl -L -o $HOME/src/llama.zip "https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip"

      - name: Unzip
        run: |
          cd $HOME/ios-sdk && unzip -o sdk.zip
          cd $HOME/src && unzip -o llama.zip
          # 解压后目录：llama.cpp-1.0.0

      - name: Locate SDK path
        id: sdk
        run: |
          SDK_DIR=$(find $HOME/ios-sdk -maxdepth 2 -type d -name "iPhoneOS17.5.sdk" | head -n1)
          echo "SDK=$SDK_DIR" >> "$GITHUB_OUTPUT"
          echo "Found SDK: $SDK_DIR"

      - name: CMake configure（iOS arm64, static, no metal, no sign）
        run: |
          SDK="${{ steps.sdk.outputs.SDK }}"
          SRC="$HOME/src/llama.cpp-1.0.0"

          cmake -B $HOME/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=OFF \
            -DGGML_BLAS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_IS_DEV=OFF \
            -DCMAKE_C_FLAGS="-target arm64-apple-ios16.4 -isysroot $SDK" \
            -DCMAKE_CXX_FLAGS="-target arm64-apple-ios16.4 -isysroot $SDK" \
            -DCMAKE_EXE_LINKER_FLAGS="-target arm64-apple-ios16.4 -isysroot $SDK -Wl,-no_adhoc_codesign" \
            -S "$SRC"

      - name: Build llama-cli + llama-server
        run: |
          cmake --build $HOME/build --target llama-cli llama-server -j$(sysctl -n hw.logicalcpu)

      - name: Strip codesign completely（裸二进制）
        run: |
          for bin in llama-cli llama-server; do
            BIN="$HOME/build/bin/$bin"
            if [ -f "$BIN" ]; then
              codesign --remove-signature "$BIN" || true
            fi
          done

      - name: Inspect binaries（调试用，后面可删）
        run: |
          file $HOME/build/bin/llama-cli
          file $HOME/build/bin/llama-server
          otool -l $HOME/build/bin/llama-cli | grep -A3 LC_CODE_SIGNATURE || echo "no code signature"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llama-ios-arm64-nosign
          path: |
            $HOME/build/bin/llama-cli
            $HOME/build/bin/llama-server
