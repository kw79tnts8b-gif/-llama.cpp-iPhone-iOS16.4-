name: Build default.metallib (iOS18.5 SDK, deploy 16.4)

on:
  workflow_dispatch:

jobs:
  build-metallib:
    runs-on: macos-15

    env:
      LLAMA_TAG: v0.9.0

    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --depth 1 --branch ${{ env.LLAMA_TAG }} https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git submodule update --init --recursive

      - name: Download iPhoneOS18.5.sdk
        run: |
          curl -L -o iPhoneOS18.5.sdk.zip \
            https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip
          mkdir -p $HOME/sdks
          unzip -q iPhoneOS18.5.sdk.zip -d $HOME/sdks
          SDK=$(find $HOME/sdks -name "iPhoneOS*.sdk" -type d | head -n 1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "Found SDK: $SDK"
          ls "$SDK/System/Library/Frameworks/Metal.framework"

      - name: Configure CMake (Metal, no embed)
        run: |
          cd llama.cpp
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON
        env:
          SDK: ${{ env.SDK }}

      - name: Build
        run: |
          cd llama.cpp
          cmake --build build-ios -j$(sysctl -n hw.ncpu)

      - name: Locate and upload default.metallib
        run: |
          cd llama.cpp
          echo "Searching for default.metallib:"
          find build-ios -name 'default.metallib'
        continue-on-error: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: llama.cpp/build-ios/bin/default.metallib
