name: build-llama-metal-signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Install dependencies
        run: |
          brew install cmake ninja
          brew install ldid || true

      - name: Download & prepare SDK and source
        run: |
          # iPhoneOS 17.5 SDK
          curl -L -o iPhoneOS17.5.sdk.zip "https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip"
          
          # llama.cpp v1.0.0 源码
          curl -L -o llama.cpp-v1.0.0.zip "https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip"

          unzip iPhoneOS17.5.sdk.zip -d /tmp/
          export SDKROOT=$(echo /tmp/iPhoneOS*.sdk | head -1)

          unzip llama.cpp-v1.0.0.zip -d /tmp/
          export LLAMA_SRC=$(echo /tmp/llama.cpp-* | head -1)

          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "LLAMA_SRC=$LLAMA_SRC" >> $GITHUB_ENV

          echo "--- debug paths ---"
          echo "SDKROOT=$SDKROOT"
          echo "LLAMA_SRC=$LLAMA_SRC"
          ls -la "$SDKROOT"/usr/include 2>/dev/null | head -5 || echo "no usr/include"

      - name: Configure (CMake + Ninja, Metal ON, Static, Signed)
        run: |
          mkdir -p build && cd build
          cmake "$LLAMA_SRC" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_INSTALL_PREFIX="" \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_SHARED=OFF \
            -DGGML_STATIC=ON \
            -DLLAMA_BUILD_SHARED_LIBS=OFF \
            -DLLAMA_SHARED=OFF \
            -DLLAMA_STATIC=ON \
            \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_SHADER_DEBUG=OFF \
            -DGGML_ACCELERATE=ON \
            -DGGML_NEON=ON \
            \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON

      - name: Build
        run: |
          cd build
          ninja llama-cli llama-server
          echo "--- build complete ---"
          ls -lh bin/

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/bin/llama-cli out/
          cp build/bin/llama-server out/
          find build -name "*.metallib" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- collected ---"
          ls -lh out/

      - name: Sign binaries (ad-hoc, codesign built-in)
        run: |
          for bin in out/llama-cli out/llama-server; do
            echo "Signing $bin ..."
            codesign --force --sign - --timestamp=none "$bin"
            if [ $? -ne 0 ]; then
              echo "codesign failed, trying ldid..."
              ldid -S "$bin"
            fi
            echo "Verify:"
            codesign -vvv "$bin" 2>&1 || true
          done

      - name: Verify & Stats
        run: |
          echo "--- binary sizes ---"
          stat -f "%z bytes  %N" out/llama-cli out/llama-server
          echo "--- otool linkage check ---"
          otool -L out/llama-cli | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-metal-signed
          path: out/
