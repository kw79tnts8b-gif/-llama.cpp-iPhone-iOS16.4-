name: Build default.metallib for llama.cpp v0.9.0

on:
  workflow_dispatch:

jobs:
  build-metallib:
    runs-on: macos-15

    steps:
      - name: Checkout llama.cpp v0.9.0
        run: |
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          # 同步 ggml 子模块到 v0.9.0 锁定的 commit
          git submodule update --init --recursive

      - name: Download iPhoneOS27.0.sdk
        run: |
          curl -L -o iPhoneOS27.0.sdk.zip \
            https://github.com/xybp888/iOS-SDKs/releases/download/iOS27.0-SDKs/iPhoneOS27.0.sdk.zip
          mkdir -p $HOME/sdks
          unzip -q iPhoneOS27.0.sdk.zip -d $HOME/sdks
          # 自动定位解压后的 sdk 目录
          SDK=$(find $HOME/sdks -name "iPhoneOS*.sdk" -type d | head -n 1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "Found SDK: $SDK"
          ls $SDK/System/Library/Frameworks/Metal.framework

      - name: Build with CMake (Metal enabled)
        run: |
          cd llama.cpp
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ env.SDK }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build-ios -j$(sysctl -n hw.ncpu)

      - name: Locate default.metallib
        run: |
          cd llama.cpp
          find build-ios -name "default.metallib" -type f
          cp build-ios/bin/default.metallib ./default.metallib 2>/dev/null || \
          cp build-ios/ggml/src/ggml-metal/default.metallib ./default.metallib 2>/dev/null || true
          ls -lh default.metallib

      - name: Upload default.metallib
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: llama.cpp/default.metallib
          retention-days: 90

