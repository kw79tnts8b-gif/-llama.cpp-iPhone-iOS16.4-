name: Build llama.cpp for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ios-sdk"
          curl -L https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -x "__MACOSX/*" -d "$RUNNER_TEMP/ios-sdk/"
          echo "SDK path: $(find "$RUNNER_TEMP/ios-sdk" -name iPhoneOS*.sdk -not -path '*/__MACOSX/*' -type d | head -1)"

      - name: Download llama.cpp v1.0.0
        run: |
          curl -L https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip -o /tmp/llama.zip
          unzip -q /tmp/llama.zip -d /tmp/
          mv /tmp/llama.cpp-1.0.0 /tmp/llama.cpp

      - name: Configure CMake
        run: |
          SDK=$(find "$RUNNER_TEMP/ios-sdk" -name iPhoneOS*.sdk -not -path '*/__MACOSX/*' -type d | head -1)
          echo "Using SDK: $SDK"
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION=16.4 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER=$(xcrun -find clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun -find clang++) \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios16.4 \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios16.4 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DGGML_METAL=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_SUBPROCESS=OFF

      - name: Build
        run: cmake --build /tmp/llama-build --config Release -j$(sysctl -n hw.ncpu)

      - name: Strip signature and symbols
        run: |
          for f in /tmp/llama-build/bin/llama-cli /tmp/llama-build/bin/llama-server; do
            echo "Processing $f"
            codesign --remove-signature "$f" 2>/dev/null || true
            strip -x "$f"
          done

      - name: Verify no signature
        run: |
          for f in /tmp/llama-build/bin/llama-cli /tmp/llama-build/bin/llama-server; do
            echo "=== $f ==="
            file "$f"
            otool -l "$f" | grep -c LC_CODE_SIGNATURE || echo "0 signature segments (good)"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-arm64
          path: |
            /tmp/llama-build/bin/llama-cli
            /tmp/llama-build/bin/llama-server
