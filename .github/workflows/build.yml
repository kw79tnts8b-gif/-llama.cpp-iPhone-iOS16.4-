name: Build llama.cpp for iOS (jailbroken, arm64, Metal)
on:
  workflow_dispatch:
env:
  SDK_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.9.0.zip
  DEPLOYMENT_TARGET: "16.4"
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download & extract iPhoneOS SDK
        run: |
          curl -L "$SDK_URL" -o iPhoneOS18.5.sdk.zip
          unzip -q iPhoneOS18.5.sdk.zip
          if [ -d "iPhoneOS18.5.sdk/iPhoneOS18.5.sdk" ]; then
            mv iPhoneOS18.5.sdk/iPhoneOS18.5.sdk ./
          fi
          echo "SDK_DIR=$(pwd)/iPhoneOS18.5.sdk" >> $GITHUB_ENV
          echo "SDK path: $(pwd)/iPhoneOS18.5.sdk"

      - name: Download & extract llama.cpp v0.9.0
        run: |
          curl -L "$LLAMA_URL" -o llama.cpp.zip
          unzip -q llama.cpp.zip
          mv llama.cpp-0.9.0 llama.cpp
          echo "LLAMA_DIR=$(pwd)/llama.cpp" >> $GITHUB_ENV

      - name: Configure CMake (Metal, fully manual toolchain)
        run: |
          XCODE_DIR=$(xcode-select -p)
          CC="$XCODE_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CXX="$XCODE_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          cmake -B "$LLAMA_DIR/build-ios-metal" \
            -S "$LLAMA_DIR" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ env.SDK_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
            -DIPHONEOS_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
            -DGGML_METAL_TARGET_OS=ios \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLAMA_STATIC=ON \
            -DGGML_STATIC=ON \
            -DLLAMA_NATIVE=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=OFF \
            -DGGML_ACCELERATE=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios-metal" --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Ad-hoc codesign for jailbroken iOS
        run: |
          ENT=$(mktemp).plist
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>platform-application</key><true/>
          <key>com.apple.private.security.no-sandbox</key><true/>
          <key>com.apple.private.security.container-required</key><false/>
          <key>task_for_pid-allow</key><true/>
          <key>get-task-allow</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - --entitlements "$ENT" "$LLAMA_DIR/build-ios-metal/bin/llama-cli"
          codesign --force --sign - --entitlements "$ENT" "$LLAMA_DIR/build-ios-metal/bin/llama-server"
          rm "$ENT"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$LLAMA_DIR/build-ios-metal/bin/llama-cli" dist/ || true
          cp "$LLAMA_DIR/build-ios-metal/bin/llama-server" dist/ || true
          if [ ! -f "dist/llama-cli" ]; then
            find "$LLAMA_DIR/build-ios-metal" -name "llama-cli" -exec cp {} dist/ \;
          fi
          if [ ! -f "dist/llama-server" ]; then
            find "$LLAMA_DIR/build-ios-metal" -name "llama-server" -exec cp {} dist/ \;
          fi
          chmod +x dist/llama-cli dist/llama-server
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal
          path: dist/
