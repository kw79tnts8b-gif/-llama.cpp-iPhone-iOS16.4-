name: Build llama.cpp for iOS (jailbroken, arm64, Metal, iOS 16.4)

on:
  workflow_dispatch:

env:
  SDK_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.8.0.zip
  DEPLOYMENT_TARGET: "16.4"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          curl -L -o iPhoneOS.sdk.zip "$SDK_URL"
          unzip -q iPhoneOS.sdk.zip
          sudo mv iPhoneOS18.5.sdk /usr/local/share/iPhoneOS.sdk

      - name: Download llama.cpp
        run: |
          curl -L -o llama.zip "$LLAMA_URL"
          unzip -q llama.zip
          mv llama.cpp-0.8.0 llama.cpp
          echo "LLAMA_DIR=$(pwd)/llama.cpp" >> $GITHUB_ENV

      - name: Patch Metal assert (robust python fallback)
        run: |
          cd "$LLAMA_DIR"
          python3 - <<'PY'
          import re
          f = "ggml/src/ggml-metal/ggml-metal-context.m"
          s = open(f).read()

          # 1) 替换 GGML_ASSERT(buf_dst); -> fallback
          s = s.replace(
              "GGML_ASSERT(buf_dst);",
              'if (bid_dst.metal == nil) {\n'
              '        GGML_LOG_DEBUG("Metal: buf_dst alloc failed, fallback CPU\\n");\n'
              '        return false;\n'
              '    }'
          )
          # 2) 替换 GGML_ASSERT(buf_src); -> fallback
          s = s.replace(
              "GGML_ASSERT(buf_src);",
              'if (bid_src.metal == nil) {\n'
              '        GGML_LOG_DEBUG("Metal: buf_src alloc failed, fallback CPU\\n");\n'
              '        return false;\n'
              '    }'
          )
          # 3) 替换 if(bid_dst.metal==nil){GGML_ABORT} -> fallback
          s = s.replace(
              'if (bid_dst.metal == nil) {\n'
              '        GGML_ABORT("%s: failed to find buffer for tensor \'%s\'\\n", __func__, tensor->name);\n'
              '    }',
              'if (bid_dst.metal == nil) {\n'
              '        GGML_LOG_DEBUG("Metal: bid_dst missing, fallback CPU\\n");\n'
              '        return false;\n'
              '    }'
          )
          # 4) 替换 if(bid_src.metal==nil){GGML_ABORT} -> fallback
          s = s.replace(
              'if (bid_src.metal == nil) {\n'
              '        GGML_ABORT("%s: failed to find buffer for tensor \'%s\'\\n", __func__, tensor->name);\n'
              '    }',
              'if (bid_src.metal == nil) {\n'
              '        GGML_LOG_DEBUG("Metal: bid_src missing, fallback CPU\\n");\n'
              '        return false;\n'
              '    }'
          )

          open(f,"w").write(s)
          print("patched")
          PY
          grep -n -E "fallback CPU|bid_(dst|src).metal == nil" ggml/src/ggml-metal/ggml-metal-context.m | head -30

      - name: Install ldid
        run: brew install ldid || true

      - name: Configure CMake
        run: |
          cd "$LLAMA_DIR"
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET \
            -DCMAKE_C_COMPILER="$(xcrun -sdk iphoneos -find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun -sdk iphoneos -find clang++)" \
            -DCMAKE_SYSROOT="/usr/local/share/iPhoneOS.sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build-ios/install" \
            -DLLAMA_BUILD=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NBUFFERS=32 \
            -DGGML_METAL_MAX_BUFFERS=64 \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios" --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Ad-hoc codesign
        run: |
          find "$LLAMA_DIR/build-ios" -name "llama-cli" -exec codesign --force --sign - {} \;
          find "$LLAMA_DIR/build-ios" -name "llama-server" -exec codesign --force --sign - {} \;

      - name: ldid sign with Metal entitlements
        run: |
          cat > metal-ent.xml <<'EOF'
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.iokit-user-client-class</key>
              <array>
                  <string>AGXDevice</string>
                  <string>AGXCommandQueue</string>
                  <string>AGXDeviceUserClient</string>
                  <string>AGXSharedUserClient</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>MTLDevice</string>
              </array>
          </dict>
          </plist>
          EOF
          ldid -Smetal-ent.xml "$LLAMA_DIR/build-ios/bin/llama-cli" || echo "ldid cli failed"
          ldid -Smetal-ent.xml "$LLAMA_DIR/build-ios/bin/llama-server" || echo "ldid server failed"

      - name: Verify minos version
        run: |
          otool -l "$LLAMA_DIR/build-ios/bin/llama-cli" | grep -A3 LC_BUILD_VERSION
          otool -l "$LLAMA_DIR/build-ios/bin/llama-server" | grep -A3 LC_BUILD_VERSION

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$LLAMA_DIR/build-ios/bin/llama-cli" dist/llama-cli-metal
          cp "$LLAMA_DIR/build-ios/bin/llama-server" dist/llama-server-metal
          chmod +x dist/llama-cli-metal dist/llama-server-metal
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal-ios16.4-v0.8.0-patched
          path: dist/
