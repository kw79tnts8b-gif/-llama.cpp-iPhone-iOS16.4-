name: Build llama.cpp for iOS (jailbroken, arm64, Metal, iOS 16.4)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  SDK_URL: https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.8.0.zip
  DEPLOYMENT_TARGET: "16.4"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download iOS SDK
        run: |
          curl -L -o iPhoneOS.sdk.zip "$SDK_URL"
          unzip -q iPhoneOS.sdk.zip
          echo "SDK_PATH=$(pwd)/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Download llama.cpp v0.8.0
        run: |
          curl -L -o llama.cpp.zip "$LLAMA_URL"
          unzip -q llama.cpp.zip
          mv llama.cpp-0.8.0 llama.cpp
          echo "LLAMA_DIR=$(pwd)/llama.cpp" >> $GITHUB_ENV

      - name: Patch Metal asserts (ALL 4 + fallback)
        run: |
          cd "$LLAMA_DIR"
          MF="ggml/src/ggml-metal/ggml-metal-context.m"
          ls -l "$MF" || { echo "File not found"; exit 1; }
          # 1) ASSERT 形式
          sed -i '' 's/GGML_ASSERT(buf_dst);/if (bid_dst.metal == nil) { GGML_LOG_DEBUG("Metal: dst buf fail, fallback CPU\n"); return false; }/' "$MF"
          sed -i '' 's/GGML_ASSERT(buf_src);/if (bid_src.metal == nil) { GGML_LOG_DEBUG("Metal: src buf fail, fallback CPU\n"); return false; }/' "$MF"
          # 2) ABORT 形式（341/391 处）
          sed -i '' '/if (bid_dst.metal == nil)/,+2 s/GGML_ABORT("[^"]*");/GGML_LOG_DEBUG("Metal: dst bid fail, fallback CPU\n"); return false;/' "$MF"
          sed -i '' '/if (bid_src.metal == nil)/,+2 s/GGML_ABORT("[^"]*");/GGML_LOG_DEBUG("Metal: src bid fail, fallback CPU\n"); return false;/' "$MF"
          echo "=== verify ==="
          grep -n "fallback CPU" "$MF" || echo "PATCH FAILED"

      - name: Configure CMake (Metal, force iOS 16.4, no KleidiAI)
        run: |
          cmake -S "$LLAMA_DIR" -B "$LLAMA_DIR/build-ios" \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NBUFFERS=32 \
            -DGGML_METAL_MAX_BUFFERS=64 \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios" --config Release --parallel $(sysctl -n hw.ncpu) 2>&1 | tail -150

      - name: Ad-hoc codesign
        run: |
          find "$LLAMA_DIR/build-ios" -type f \( -name "llama-cli" -o -name "main" -o -name "llama-server" \) -exec codesign --force --sign - {} \; || true

      - name: ldid sign with Metal entitlements
        run: |
          cat > metal-ent.xml <<'EOF'
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.iokit-user-client-class</key>
              <array>
                  <string>AGXDevice</string>
                  <string>AGXCommandQueue</string>
                  <string>AGXDeviceUserClient</string>
                  <string>AGXSharedUserClient</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>MTLDevice</string>
              </array>
          </dict>
          </plist>
          EOF
          find "$LLAMA_DIR/build-ios" -type f \( -name "llama-cli" -o -name "main" -o -name "llama-server" \) -exec ldid -Smetal-ent.xml {} \; || true

      - name: Verify minos version
        run: |
          CLI=$(find "$LLAMA_DIR/build-ios" -type f \( -name "llama-cli" -o -name "main" \) -perm -u+x | head -n 1)
          SRV=$(find "$LLAMA_DIR/build-ios" -type f -name "llama-server" -perm -u+x | head -n 1)
          echo "=== CLI minos ==="; [ -n "$CLI" ] && otool -l "$CLI" | grep -A3 LC_BUILD_VERSION || true
          echo "=== SRV minos ==="; [ -n "$SRV" ] && otool -l "$SRV" | grep -A3 LC_BUILD_VERSION || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          CLI=$(find "$LLAMA_DIR/build-ios" -type f \( -name "llama-cli" -o -name "main" \) -perm -u+x | head -n 1)
          SRV=$(find "$LLAMA_DIR/build-ios" -type f -name "llama-server" -perm -u+x | head -n 1)
          if [ -z "$CLI" ]; then echo "ERROR: llama-cli/main not found"; exit 1; fi
          cp "$CLI" dist/llama-cli-metal
          if [ -n "$SRV" ]; then cp "$SRV" dist/llama-server-metal; fi
          chmod +x dist/*
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-arm64-metal-ios16.4-v0.8.0-patched
          path: dist/
