name: build llama.cpp iOS Metal arm64 (iOS16.4 patched v0.8.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama.cpp v0.8.0
        run: |
          LLAMA_DIR="$GITHUB_WORKSPACE/_llama.cpp-iPhone"
          rm -rf "$LLAMA_DIR"
          curl -L \
            https://github.com/ggerganov/llama.cpp/archive/refs/tags/v0.8.0.tar.gz \
            -o llama.tar.gz
          tar -xzf llama.tar.gz
          mv llama.cpp-0.8.0 "$LLAMA_DIR"
          echo "LLAMA_DIR=$LLAMA_DIR" >> $GITHUB_ENV
          ls -l "$LLAMA_DIR"

      - name: Patch Metal asserts (ALL 4 + fallback)
        run: |
          cd "$LLAMA_DIR"
          MF="ggml/src/ggml-metal/ggml-metal-context.m"
          ls -l "$MF" || { echo "File not found"; exit 1; }

          # ASSERT form
          sed -i '' 's/GGML_ASSERT(buf_dst);/if (bid_dst.metal == nil) { GGML_LOG_DEBUG("Metal: dst buf fail, fallback CPU\n"); return false; }/' "$MF"
          sed -i '' 's/GGML_ASSERT(buf_src);/if (bid_src.metal == nil) { GGML_LOG_DEBUG("Metal: src buf fail, fallback CPU\n"); return false; }/' "$MF"

          # ABORT form (around 341/391)
          sed -i '' '/if (bid_dst.metal == nil)/,+2 s/GGML_ABORT("[^"]*");/GGML_LOG_DEBUG("Metal: dst bid fail, fallback CPU\n"); return false;/' "$MF"
          sed -i '' '/if (bid_src.metal == nil)/,+2 s/GGML_ABORT("[^"]*");/GGML_LOG_DEBUG("Metal: src bid fail, fallback CPU\n"); return false;/' "$MF"

          echo "=== verify ==="
          grep -n "fallback CPU" "$MF" || { echo "PATCH FAILED"; exit 1; }

      - name: Configure CMake (Metal, force iOS 16.4)
        run: |
          cmake -S "$LLAMA_DIR" -B "$LLAMA_DIR/build-ios" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$LLAMA_DIR/cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=16.4 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_INSTALL_PREFIX="$LLAMA_DIR/build-ios/install" \
            -DCMAKE_OSX_BUNDLE_DESTINATION=. \
            -DCMAKE_OSX_BUNDLE_DESTINATION_ARCHIVE=. \
            -DLLAMA_BUILD=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_ALL_WARNINGS=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NBUFFERS=32 \
            -DGGML_METAL_MAX_BUFFERS=64 \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=OFF \
            -DGGML_BACKEND_DL=OFF

      - name: Build
        run: |
          cmake --build "$LLAMA_DIR/build-ios" \
            --config Release \
            --parallel $(sysctl -n hw.ncpu) 2>&1 | tail -150

      - name: Ad-hoc codesign
        run: |
          find "$LLAMA_DIR/build-ios" -type f \
            \( -name "llama-cli" -o -name "main" \) \
            -exec codesign --force --sign - {} \; || true

      - name: ldid sign with Metal entitlements
        run: |
          cat > metal-ent.xml <<'EOF'
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.iokit-user-client-class</key>
              <array>
                  <string>AGXDevice</string>
                  <string>AGXCommandQueue</string>
                  <string>AGXDeviceUserClient</string>
                  <string>AGXSharedUserClient</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>MTLDevice</string>
              </array>
          </dict>
          </plist>
          EOF
          find "$LLAMA_DIR/build-ios" -type f \
            \( -name "llama-cli" -o -name "main" \) \
            -exec ldid -Smetal-ent.xml {} \; || true

      - name: Verify minos version
        run: |
          CLI=$(find "$LLAMA_DIR/build-ios" -type f \
            \( -name "llama-cli" -o -name "main" \) -perm -u+x | head -n 1)
          echo "=== CLI minos ==="
          [ -n "$CLI" ] && otool -l "$CLI" | grep -A3 LC_BUILD_VERSION || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          CLI=$(find "$LLAMA_DIR/build-ios" -type f \
            \( -name "llama-cli" -o -name "main" \) -perm -u+x | head -n 1)
          if [ -z "$CLI" ]; then
            echo "ERROR: llama-cli/main not found"
            exit 1
          fi
          cp "$CLI" dist/llama-cli-metal
          chmod +x dist/llama-cli-metal
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-ios-arm64-metal-ios16.4-v0.8.0-patched
          path: dist/
