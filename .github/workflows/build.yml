name: Build llama.cpp for iOS Jailbreak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout dummy
        uses: actions/checkout@v4

      - name: Download llama.cpp v1.0.0
        run: |
          cd ${{ github.workspace }} && \
          curl -L -o llama.cpp.zip https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip && \
          unzip -q llama.cpp.zip

      - name: Download iPhoneOS17.5.sdk
        run: |
          cd ${{ github.workspace }} && \
          curl -L -o iPhoneOS17.5.sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip && \
          unzip -q iPhoneOS17.5.sdk.zip

      - name: Configure with CMake (Xcode)
        run: |
          cd ${{ github.workspace }}/llama.cpp-1.0.0 && \
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ github.workspace }}/iPhoneOS17.5.sdk \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DIPHONEOS_DEPLOYMENT_TARGET=16.4 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_CPU=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DCMAKE_XCODE_ATTRIBUTES="CODE_SIGNING_ALLOWED=NO;CODE_SIGN_IDENTITY=\"\";CODE_SIGN_ENTITLEMENTS=\"\";ENTITLEMENTS_REQUIRED=NO" \
            -S .

      - name: Build llama-cli and llama-server
        run: |
          cd ${{ github.workspace }}/llama.cpp-1.0.0 && \
          cmake --build build --config Release --target llama-cli llama-server -- CODE_SIGNING_ALLOWED=NO

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-ios-arm64
          path: |
            llama.cpp-1.0.0/build/Release/llama-cli
            llama.cpp-1.0.0/build/Release/llama-server
